# Konfigurasi lokal RaceParts. Jangan dipublikasikan bila password database diisi.
# Dijalankan dari folder utama proyek (tempat folder config/, frontend/, database/ berada).

# --- MySQL (XAMPP) ---
db_host=127.0.0.1
db_port=3306
db_user=root
# XAMPP bawaan: user root tanpa password
db_pass=
db_name=raceparts_db

# --- Server web (Crow) ---
bind_address=127.0.0.1
server_port=8080
frontend_dir=frontend
session_hours=12
